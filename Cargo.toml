[workspace]
members = ["crates/giants-formats", "crates/giants-game", "crates/giants-app"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
license = "MIT"

[workspace.dependencies]
giants-formats = { path = "crates/giants-formats" }
giants-game = { path = "crates/giants-game" }
bevy = { version = "=0.20.0", default-features = false, features = ["ui_bevy_render", "bevy_pbr", "bevy_winit", "std", "keyboard", "mouse", "multi_threaded", "png", "bevy_audio", "wav"] }

[profile.dev]
opt-level = 2
debug = 1

[profile.dev.package."*"]
opt-level = 2
